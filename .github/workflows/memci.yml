name: memci

# Reports what a PR does to benchmark allocations and binary size. Runs PR code,
# so it takes no write permissions; memci-comment.yml posts the result.

on:
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  memci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # TinyGo 0.42 builds with Go 1.25 through 1.27 and refuses anything
          # outside that window, so the two versions below move together.
          go-version: "1.26"
      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.42.0"

      - uses: soypat/memci@main
        with:
          args: -targets ./cmd/... -kind package
          # bindiff lives in this repo, so measure with the copy under test
          # rather than installing a published one.
          bindiff: go run ./cmd/bindiff
          tinygo: tinygo

