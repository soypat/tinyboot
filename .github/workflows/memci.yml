name: memci

# Reports what a PR does to benchmark allocations and binary size. Runs PR code,
# so it takes no write permissions; memci-comment.yml posts the result.

on:
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  memci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      # Both binaries here are host tools. A TinyGo target would need
      # acifani/setup-tinygo installed above and a build command naming it.
      - uses: soypat/memci@main
        with:
          args: -kind package
          # bindiff lives in this repo, so measure with the copy under test
          # rather than installing a published one.
          bindiff: go run ./cmd/bindiff
          targets: .github/memci.json
